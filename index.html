<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <title>Document</title>

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/components/header.css">
    <link rel="stylesheet" href="styles/components/footer.css">
    <link rel="stylesheet" href="styles/pages/index.css">
  </head>

  <body>
    <div class="header-container">
    </div>

    <div class="main-container">
      <div class="outer-box">
        <div class="new-arrivals">
          <img class="new-arrivals-banner" src="assets/main-assets/newCollections-Banner.webp" alt="Banner">
          <div class="absolute-text-container">
            <div class="text-row-1">
              <a class="redirect-text" href="/">Home</a>
              <i class="redirect-symbol">/</i>
              <a class="redirect-text" href="/">Shop</a>
              <i class="redirect-symbol">/</i>
              New Arrivals
            </div>
            <div class="text-row-2">
              <h2 class="new-arrivals-heading">NEW ARRIVALS</h2>
            </div>
            <div class="text-row-3">
              <div class="brand-attributes-div">
                <img class="cloth-benifits-img" src="assets/main-assets/all_day_comfort_fit_1.png" alt="E">
                <p class="attribute-heading">All-Day Comfort Fit</p> 
              </div>
              <div class="brand-attributes-div">
                <img class="cloth-benifits-img" src="assets/main-assets/effortless_Fresh_Look.webp" alt="F">
                <p class="attribute-heading">Effortless Fresh Look</p>
              </div>
              <div class="brand-attributes-div">
                <img class="cloth-benifits-img" src="assets/main-assets/Easy_to_Style_1.jpg" alt="S">
                <p class="attribute-heading">Easy To Style Silhouettes</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="products-container">
        <div class="products-navigation">
          <div class="filters-navigation">
            <svg class="filter-svg-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <line x1="4" y1="17" x2="20" y2="17"></line>
              <circle cx="10" cy="7" r="2" fill="currentColor"></circle>
              <circle cx="14" cy="17" r="2" fill="currentColor"></circle>
            </svg>
            <span class="filter-text">FILTER AND SORT</span>
          </div>
          <div class="sorting-navigation">
            <div class="select-container">
              <select class="sort-by">
                <option value="featured">FEATURED</option>
                <option value="best-selling">BEST SELLING</option>
                <option value="price-lth">PRICE, LOW TO HIGH</option>
                <option value="price-htl">PRICE, HIGH TO LOW</option>
              </select>
              <div class="select-arrow">
                <svg width="8" height="6" viewBox="0 0 8 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6.75 1.5L3.75 4.5L0.75 1.5"
                        stroke="rgb(69, 66, 66)"
                        stroke-width="1.1"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                  </path>
                </svg>
              </div>
            </div>
            <div class="product-count">2828 PRODUCTS</div>
          </div>
        </div>

        <div class="products-grid js-products-grid">
        </div>
      </div>
    </div>

    <div class="footer-container">
    </div>

    <script src="data/products.js"></script>
    <script src="data/cart.js"></script>
    <script src="scripts/components/header.js"></script>
    <script src="scripts/components/footer.js"></script>
    <script src="scripts/index.js"></script>
  </body>
</html>
